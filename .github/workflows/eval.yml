name: eval
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: ./packages/action
        with:
          working-directory: examples/tool-use
          run-command: pnpm run eval --out "$AGENTKIT_OUT"
